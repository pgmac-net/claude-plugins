name: sre-harness

on:
  pull_request:
    paths:
      - "plugins/sre-harness/**"
      - ".github/workflows/sre-harness.yml"
  push:
    branches: ["main"]
    paths:
      - "plugins/sre-harness/**"
      - ".github/workflows/sre-harness.yml"

permissions:
  contents: read

concurrency:
  group: sre-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/sre-harness
    env:
      TEST_DEPS: --with pytest --with jsonschema --with pyyaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Pylint
        run: uv run --no-project $TEST_DEPS --with pylint pylint scripts tests

      - name: Tests
        run: uv run --no-project $TEST_DEPS pytest -q

      - name: Validate the site template
        run: uv run scripts/validate_site.py --site templates/site-repo

      # Generic patterns only. A site's real identifiers are checked locally
      # against its private denylist and never appear in this repository.
      - name: No site identifiers in the plugin
        run: uv run scripts/check_identifiers.py .
