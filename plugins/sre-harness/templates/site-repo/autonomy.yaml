# Pre-approved (Tier 2) actions: mutations an agent may run during an incident
# without asking. Nothing is Tier 2 unless it is listed here, and this file is
# changed only by reviewed pull request.
#
# A command is Tier 2 only if it matches a template exactly, token for token,
# with every {placeholder} satisfying its rule. Anything else is Tier 1.
#
# Templates may use only letters, digits, . _ : / = @ , + - and single spaces.
# No quoting, pipes or shell expansion: the harness runs the command itself,
# without a shell. An action that needs more is a script on the target.
schema_version: 1

# Site-wide switch. While false, every action is Tier 1.
tier2_enabled: false

# Services whose actions are suspended, for example while an error budget is spent.
disabled_services: []

actions: []
