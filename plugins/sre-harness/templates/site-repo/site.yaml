# sre-harness site configuration. Validate with the plugin's scripts/validate_site.py.
# Never put a secret here: name the environment variable that holds it.
schema_version: 3

site:
  name: example
  description: Example site. Replace every value below.

repos:
  # 'catalog' is this repository.
  catalog:
    repo: example-org/sre-catalog
    visibility: private
  incidents:
    repo: example-org/incidents
    visibility: private
    path: ~/src/incidents
    runbooks_path: docs/runbooks
    pirs_path: docs/incidents
    templates_path: docs/templates
    fallback_url: https://incidents.example.com/

tracker:
  repo: incidents
  incident_label: incident

monitoring:
  - name: alerts
    type: nagios
    description: Host and service checks. Source of alerts.
    endpoint: https://monitoring.example.com/
    mcp_server: nagios
    credentials_env: [NAGIOS_USER, NAGIOS_PASSWORD]
  - name: metrics
    type: grafana
    description: Metrics and logs. Source of SLIs.
    endpoint: https://example.grafana.net/
    credentials_env: [GRAFANA_TOKEN]

tiers_file: tiers.yaml
patterns_path: patterns

# The service catalog. Sync rewrites catalog/generated/ from these sources;
# everything else under catalog/ is written by people.
catalog:
  path: catalog
  default_owner: user:example-owner
  runbooks_repo: incidents
  # Each source reads a local git checkout, never a live system. The repo
  # alias must have a 'path'. Uncomment and adapt:
  sources: []
  #  - name: hosts
  #    type: ansible-inventory
  #    repo: ansible
  #    path: inventory/hosts.ini
  #    options:
  #      exclude_groups: [workstations]
  #  - name: cluster-apps
  #    type: argocd-applications
  #    repo: gitops
  #    path: apps
  #    pattern: argocd-helm-app
  #    options:
  #      cluster: main
  #      kube_context: main
  #  - name: checks
  #    type: nagios-objects
  #    repo: nagios-config
  #    path: objects

# Audit logs record every command run during an incident. Keep them private.
audit:
  repo: catalog
  path: audit

# How incidents are worked here.
incident:
  # Times are stored in UTC and shown to people in this zone.
  timezone: Etc/UTC
  # Where this site's P1 to P4 criteria are written down.
  severity_criteria:
    repo: incidents
    path: docs/templates/pir-template.md
  # Longest gap between status updates. A severity left out needs none.
  update_minutes:
    P1: 30
    P2: 60
    P3: 240
  # Site procedures: how things are done here. The harness says when to read
  # them; these files say how.
  procedures_path: procedures
  procedures:
    triage: [triage.md]
    evidence: [evidence.md]
    comms: [comms.md]
    review: [review.md]
  evidence_dir: ~/incident-evidence
  # Allow-list of pre-approved (Tier 2) actions. Empty and switched off until you add to it.
  autonomy_file: autonomy.yaml
  # Practice incidents are tracked here, never in a public repository.
  drill:
    repo: catalog
    label: drill

# Reserved. Filled in by later schema versions.
chat: {}
slo: {}
