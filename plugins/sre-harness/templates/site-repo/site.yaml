# sre-harness site configuration. Validate with the plugin's scripts/validate_site.py.
# Never put a secret here: name the environment variable that holds it.
schema_version: 6

site:
  name: example
  description: Example site. Replace every value below.

repos:
  # 'catalog' is this repository.
  catalog:
    repo: example-org/sre-catalog
    visibility: private
  incidents:
    repo: example-org/incidents
    visibility: private
    path: ~/src/incidents
    runbooks_path: docs/runbooks
    pirs_path: docs/incidents
    templates_path: docs/templates
    fallback_url: https://incidents.example.com/

tracker:
  repo: incidents
  incident_label: incident

monitoring:
  - name: alerts
    type: nagios
    description: Host and service checks. Source of alerts.
    endpoint: https://monitoring.example.com/
    mcp_server: nagios
    credentials_env: [NAGIOS_USER, NAGIOS_PASSWORD]
  - name: metrics
    type: grafana
    description: Metrics and logs. Source of SLIs.
    endpoint: https://example.grafana.net/
    credentials_env: [GRAFANA_TOKEN]

tiers_file: tiers.yaml
patterns_path: patterns

# The service catalog. Sync rewrites catalog/generated/ from these sources;
# everything else under catalog/ is written by people.
catalog:
  path: catalog
  default_owner: user:example-owner
  runbooks_repo: incidents
  # Each source reads a local git checkout, never a live system. The repo
  # alias must have a 'path'. Uncomment and adapt:
  sources: []
  #  - name: hosts
  #    type: ansible-inventory
  #    repo: ansible
  #    path: inventory/hosts.ini
  #    options:
  #      exclude_groups: [workstations]
  #  - name: cluster-apps
  #    type: argocd-applications
  #    repo: gitops
  #    path: apps
  #    pattern: argocd-helm-app
  #    options:
  #      cluster: main
  #      kube_context: main
  #  - name: checks
  #    type: nagios-objects
  #    repo: nagios-config
  #    path: objects

# Audit logs record every command run during an incident. Keep them private.
audit:
  repo: catalog
  path: audit

# How incidents are worked here.
incident:
  # Times are stored in UTC and shown to people in this zone.
  timezone: Etc/UTC
  # Where this site's P1 to P4 criteria are written down.
  severity_criteria:
    repo: incidents
    path: docs/templates/pir-template.md
  # Longest gap between status updates. A severity left out needs none.
  update_minutes:
    P1: 30
    P2: 60
    P3: 240
  # Site procedures: how things are done here. The harness says when to read
  # them; these files say how.
  procedures_path: procedures
  procedures:
    triage: [triage.md]
    evidence: [evidence.md]
    comms: [comms.md]
    review: [review.md]
  evidence_dir: ~/incident-evidence
  # Allow-list of pre-approved (Tier 2) actions. Empty and switched off until you add to it.
  autonomy_file: autonomy.yaml
  # Optional advisory helper: a judgment model that suggests a severity, ranks
  # runbooks and types timeline entries. It never decides anything. Enabling it
  # sends masked incident text to a third party. Off unless you add this:
  # assist:
  #   provider: jev
  #   enabled: true
  #   api_key_env: TYPESAFE_API_KEY
  #   mask_file: site-identifiers.txt
  #   model: <pin a model id>
  # Practice incidents are tracked here, never in a public repository.
  drill:
    repo: catalog
    label: drill

# Chat-ops gateway (gateway/ in the plugin). Empty means no gateway. Holds IDs,
# never tokens: secrets_env names the environment variables that hold them.
# Approvers must also be responders; change either only by reviewed pull request.
# chat:
#   adapter: slack
#   hub_channel: <channel ID of the incidents hub>
#   responders: [<user ID>]
#   approvers: [<user ID>]
#   approval_ttl_seconds: 300
#   idle_stop_minutes: 30
#   max_sessions: 2
#   allow: []   # e.g. mcp__<server>__<tool>, one read-only MCP tool per entry
#   secrets_env:
#     bot_token: SLACK_BOT_TOKEN
#     app_token: SLACK_APP_TOKEN
chat: {}

# Journeys and SLOs (skill define-journey, script slo.py). Empty means none.
# SLIs are evaluated by a Prometheus-compatible backend. No SLO window may be
# longer than retention_days; on a 14-day free tier, use 7d windows.
# slo:
#   backend: prometheus
#   url: https://<prometheus host>/api/prom
#   user: "<instance id>"            # basic-auth user, if the backend needs one
#   token_env: METRICS_READ_TOKEN     # read-only token; or token_file: metrics-read-token (in ~/.config/sre-harness/, mode 600)
#   retention_days: 14
#   journeys_path: catalog/journeys
#   rules_file: slo/rules.yaml
#   dashboard_file: slo/dashboard.json   # optional: slo.py dashboard writes a Grafana dashboard for every SLO
slo: {}

# Reliability design (skill design-review, scripts stpa.py and trends.py).
# Every key is optional; empty means the defaults shown.
# reliability:
#   analyses_path: analyses/stpa        # one STPA analysis per service: <service>.md
#   theme_min_pirs: 3                   # PIRs on one service or tag that make a recurring theme
#   theme_window_days: 180              # rolling window for themes
#   stale_action_days: 60               # an open action item older than this is stale
#   action_labels: [incident, design-review]
#   ignore_tags: []                     # tags never counted as a theme
reliability: {}
