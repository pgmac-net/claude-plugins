[project]
name = "sre-gateway"
version = "0.13.0"
description = "Chat-ops gateway for the sre-harness plugin: drives an incident agent from chat, with identity-bound approvals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.182",
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
    "aiohttp>=3.10",
    "jsonschema>=4.21",
    "pyyaml>=6",
]

[project.scripts]
sre-gateway = "sre_gateway.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pylint>=3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_gateway"]

[tool.ruff]
extend = "../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S108", "PLR0911", "PLR0912", "PLR2004", "SLF001"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-attributes = 12

[tool.pylint."messages control"]
disable = [
    "missing-function-docstring",
    "missing-class-docstring",
    "redefined-outer-name",
    "too-few-public-methods",
    "use-implicit-booleaness-not-comparison",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
