# Slack app for the sre-harness chat gateway.
# Create it at https://api.slack.com/apps > Create New App > From a manifest,
# install it to the workspace, then create an app-level token with the
# connections:write scope (Basic Information > App-Level Tokens).
# Socket Mode: no request URL, no inbound port.
display_information:
  background_color: "#1E293B"
  name: SRE Harness
  description: Works incidents with an agent; mutations need an approver's click.
features:
  bot_user:
    display_name: sre-harness
    always_online: true
  slash_commands:
    - command: /incident
      description: Start an incident (or "drill <text>" for a practice one)
      usage_hint: "[drill] what is broken"
      should_escape: false
    - command: /sre
      description: Ask a read-only reliability question; opens no incident
      usage_hint: "where does the ingress SLO stand?"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write          # post and edit messages and approval requests
      - commands            # /incident and /sre
      - groups:write        # create, invite to and archive private incident channels
      - groups:read
      - groups:history      # read messages in incident channels
      - channels:read
      - channels:history    # read the hub channel, if it is public
      - users:read          # show approvers' names
      - files:read          # read a snippet or text file a responder attaches (chat.attachments in site.yaml)
      - files:write         # post an image the agent shares with share.py (chat.images in site.yaml)
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
